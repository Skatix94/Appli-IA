<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Atelier Vidéo — Super App</title>
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atelier Vidéo">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
        --bg: #fafafa; --panel: #ffffff; --panel-2: #f5f5f5; --border: #e5e5e5;
        --ink: #1a1a1a; --ink-dim: #777; --ink-faint: #aaa;
        --success: #2d8a4e; --error: #c0392b; --warn: #d4a017; --info: #4a6cf7;
        --radius: 12px;
        --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background: var(--bg); color: var(--ink); min-height: 100vh;
        padding: 1rem 1rem calc(6rem + var(--safe-bottom)); font-size: 15px; line-height: 1.5;
        max-width: 900px; margin: 0 auto;
    }
    header { margin-bottom: 1rem; text-align: center; }
    h1 { font-size: 1.4rem; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 0.3rem; }
    .subtitle { font-size: 0.8rem; color: var(--ink-dim); font-style: italic; }

    .toast {
        position: fixed; top: 1.5rem; left: 50%;
        transform: translateX(-50%) translateY(-100px);
        background: var(--ink); color: #fff; padding: 0.85rem 1.4rem;
        border-radius: 10px; font-size: 0.85rem; font-weight: 500;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 1000; opacity: 0;
        transition: transform 0.35s ease, opacity 0.35s ease;
        max-width: 90vw; text-align: center;
    }
    .toast.visible { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--error); }
    .toast.warn { background: var(--warn); }

    .section {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: var(--radius); margin-bottom: 0.8rem; overflow: hidden;
    }
    .section-header {
        padding: 0.85rem 1rem; cursor: pointer; user-select: none;
        display: flex; justify-content: space-between; align-items: center;
    }
    .section-header:active { background: var(--panel-2); }
    .section-title {
        font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em;
        color: var(--ink-dim); font-weight: 600;
    }
    .section-title .badge {
        display: inline-block; margin-left: 0.4rem; padding: 0.1rem 0.4rem;
        background: var(--ink); color: #fff; border-radius: 10px;
        font-size: 0.65rem;
    }
    .section-header .chevron {
        font-size: 0.7rem; color: var(--ink-faint); transition: transform 0.2s;
    }
    .section.open .section-header .chevron { transform: rotate(180deg); }
    .section-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
    .section.open .section-body { max-height: 5000px; }
    .section-content { padding: 0 1rem 1rem; }

    .mode-current {
        background: var(--ink); color: #fff;
        padding: 1rem; border-radius: 10px; margin-bottom: 0.8rem;
        display: flex; align-items: center; gap: 0.8rem;
    }
    .mode-current .m-emoji { font-size: 2rem; }
    .mode-current .m-info { flex: 1; }
    .mode-current .m-name { font-size: 1rem; font-weight: 600; }
    .mode-current .m-desc { font-size: 0.75rem; opacity: 0.8; margin-top: 0.15rem; }
    .mode-current .m-num {
        font-size: 0.7rem; opacity: 0.6;
        background: rgba(255,255,255,0.15);
        padding: 0.15rem 0.5rem; border-radius: 10px;
    }

    .mode-search {
        width: 100%; padding: 0.7rem 0.9rem; border-radius: 8px;
        border: 1px solid var(--border); background: #fafafa;
        color: var(--ink); font-family: inherit; font-size: 0.88rem;
        margin-bottom: 0.6rem;
    }
    .mode-search:focus { outline: none; border-color: var(--ink); }

    .mode-category {
        font-size: 0.7rem; font-weight: 700; color: var(--ink-dim);
        text-transform: uppercase; letter-spacing: 0.08em;
        padding: 0.6rem 0 0.3rem;
        border-bottom: 1px solid var(--border); margin-bottom: 0.4rem;
    }
    .mode-category:first-child { padding-top: 0; }

    .mode-list {
        display: grid; grid-template-columns: 1fr; gap: 0.4rem;
        max-height: 400px; overflow-y: auto; margin-top: 0.4rem;
    }
    .mode-item {
        padding: 0.7rem 0.8rem; border-radius: 8px;
        border: 1px solid var(--border); background: var(--panel-2);
        cursor: pointer; transition: all 0.15s;
        display: flex; align-items: center; gap: 0.6rem;
    }
    .mode-item:active { transform: scale(0.99); }
    .mode-item.selected { background: var(--ink); color: #fff; border-color: var(--ink); }
    .mode-item .mi-emoji { font-size: 1.3rem; flex-shrink: 0; }
    .mode-item .mi-info { flex: 1; min-width: 0; }
    .mode-item .mi-name { font-size: 0.85rem; font-weight: 600; }
    .mode-item .mi-desc { font-size: 0.7rem; opacity: 0.7; margin-top: 0.1rem; }
    .mode-item .mi-num {
        font-size: 0.65rem; opacity: 0.5;
        background: rgba(0,0,0,0.05); padding: 0.1rem 0.4rem; border-radius: 8px;
    }
    .mode-item.selected .mi-num { background: rgba(255,255,255,0.15); opacity: 0.8; }

    .api-panel {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 0.9rem 1rem;
        margin-bottom: 0.8rem;
    }
    .api-panel.ok { border-color: var(--success); }
    .api-key-input {
        width: 100%; padding: 0.75rem 0.9rem; border-radius: 8px;
        border: 1px solid var(--border); background: #fafafa;
        font-family: ui-monospace, monospace; font-size: 0.8rem;
        margin-bottom: 0.5rem;
    }
    .api-key-input:focus { outline: none; border-color: var(--ink); }
    .api-save-btn {
        width: 100%; padding: 0.7rem; border-radius: 8px; border: none;
        background: var(--ink); color: #fff; font-size: 0.85rem;
        font-weight: 600; cursor: pointer;
    }
    .api-status-line {
        font-size: 0.72rem; padding: 0.5rem 0.7rem; border-radius: 6px;
        margin-top: 0.5rem; display: flex; align-items: center; gap: 0.4rem;
        background: var(--panel-2); color: var(--ink-dim);
    }
    .api-status-line.ok { background: #e3f5e9; color: var(--success); }
    .api-status-line .status-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--ink-faint); flex-shrink: 0;
    }
    .api-status-line.ok .status-dot { background: var(--success); }

    .upload-zone {
        border: 2px dashed var(--border); border-radius: var(--radius);
        padding: 1.5rem 1rem; text-align: center; cursor: pointer;
        transition: border-color 0.2s; margin-bottom: 0.8rem;
        background: var(--panel);
    }
    .upload-zone:active { border-color: var(--ink); }
    .upload-zone input[type="file"] { display: none; }
    .upload-icon { font-size: 2rem; margin-bottom: 0.4rem; opacity: 0.6; }
    .upload-text { font-size: 0.9rem; }
    .upload-hint { font-size: 0.72rem; color: var(--ink-dim); margin-top: 0.2rem; }

    .images-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 0.4rem; margin-bottom: 0.8rem;
    }
    .image-card {
        position: relative; border-radius: 8px; overflow: hidden;
        border: 1px solid var(--border); aspect-ratio: 9/16; background: #f0f0f0;
    }
    .image-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .image-card .remove-btn {
        position: absolute; top: 3px; right: 3px;
        background: rgba(0,0,0,0.65); color: #fff; border: none;
        width: 20px; height: 20px; border-radius: 50%; font-size: 10px;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    textarea, input[type="text"] {
        width: 100%; padding: 0.7rem 0.85rem; border-radius: 8px;
        border: 1px solid var(--border); background: #fafafa;
        color: var(--ink); font-family: inherit; font-size: 0.85rem;
        min-height: 60px; resize: vertical;
    }
    textarea:focus, input[type="text"]:focus { outline: none; border-color: var(--ink); }

    .control-row { margin-bottom: 0.7rem; }
    .control-label {
        display: block; font-size: 0.7rem; color: var(--ink-dim);
        margin-bottom: 0.35rem; text-transform: uppercase;
        letter-spacing: 0.06em; font-weight: 600;
    }
    select {
        width: 100%; padding: 0.65rem 0.85rem; border-radius: 8px;
        border: 1px solid var(--border); background: #fafafa;
        color: var(--ink); font-family: inherit; font-size: 0.85rem;
        -webkit-appearance: none; appearance: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%231a1a1a' d='M0 0l5 6 5-6z'/></svg>");
        background-repeat: no-repeat; background-position: right 0.8rem center;
        background-size: 10px;
    }

    .btn-primary {
        width: 100%; padding: 1rem; border-radius: var(--radius);
        border: none; background: var(--ink); color: #fff;
        font-size: 0.95rem; font-weight: 600; cursor: pointer;
        margin-bottom: 0.8rem;
    }
    .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-stop {
        width: 100%; padding: 0.7rem; border-radius: var(--radius);
        border: 1px solid var(--border); background: var(--panel);
        color: var(--error); font-size: 0.85rem; font-weight: 600;
        cursor: pointer; margin-bottom: 0.8rem; display: none;
    }
    .btn-stop.visible { display: block; }

    .queue-summary {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.5rem;
        font-size: 0.75rem; display: flex; justify-content: space-between;
    }
    .queue-item {
        display: flex; align-items: center; gap: 0.7rem;
        padding: 0.6rem 0.7rem; border-radius: 8px;
        border: 1px solid var(--border); margin-bottom: 0.3rem;
        background: var(--panel); font-size: 0.78rem;
    }
    .queue-item.pending { opacity: 0.5; }
    .queue-item.creating { border-color: var(--warn); }
    .queue-item.processing { border-color: var(--ink); }
    .queue-item.done { border-color: var(--success); }
    .queue-item.failed { border-color: var(--error); }
    .q-name { flex: 1; min-width: 0; }
    .q-status { font-size: 0.7rem; color: var(--ink-dim); }

    .gallery-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 0.6rem;
    }
    .gallery-item {
        border-radius: var(--radius); overflow: hidden;
        border: 1px solid var(--border); background: #000;
    }
    .gallery-item video { width: 100%; display: block; aspect-ratio: 9/16; object-fit: cover; }
    .gallery-item .g-caption {
        padding: 0.4rem 0.6rem; background: var(--panel);
        font-size: 0.68rem; color: var(--ink-dim);
        display: flex; justify-content: space-between; align-items: center;
    }

    .status-bar {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: var(--ink); color: #fff; padding: 0.7rem 1rem;
        padding-bottom: calc(0.7rem + var(--safe-bottom));
        font-size: 0.78rem; display: flex; align-items: center; gap: 0.6rem;
        transform: translateY(100%); transition: transform 0.3s;
        z-index: 100;
    }
    .status-bar.visible { transform: translateY(0); }
    .status-bar .spinner {
        width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff; border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #noSleepCanvas, #noSleepVideo {
        position: fixed; top: 0; left: 0; width: 1px; height: 1px;
        opacity: 0.01; pointer-events: none; z-index: -1;
    }
</style>
</head>
<body>

<header>
    <h1>Atelier Vidéo</h1>
    <p class="subtitle">60+ modes pour créer des vidéos IA</p>
</header>

<div class="api-panel" id="api-panel">
    <input type="password" class="api-key-input" id="api-key-input"
           placeholder="Clé API (sk-...)" autocomplete="off">
    <button type="button" class="api-save-btn" id="api-save-btn">Enregistrer la clé</button>
    <div class="api-status-line" id="api-status-line">
        <span class="status-dot"></span>
        <span id="api-status-text">Aucune clé API</span>
    </div>
</div>

<div class="section open" id="section-mode">
    <div class="section-header" data-toggle="section-mode">
        <span class="section-title">🎬 Mode de génération</span>
        <span class="chevron">▼</span>
    </div>
    <div class="section-body">
        <div class="section-content">
            <div class="mode-current" id="mode-current">
                <div class="m-emoji" id="mc-emoji">📢</div>
                <div class="m-info">
                    <div class="m-name" id="mc-name">Publicité Produit</div>
                    <div class="m-desc" id="mc-desc">Spot pub pro</div>
                </div>
                <div class="m-num" id="mc-num">#294</div>
            </div>
            <input type="text" class="mode-search" id="mode-search" placeholder="Rechercher un mode...">
            <div class="mode-list" id="mode-list"></div>
        </div>
    </div>
</div>

<div class="upload-zone" id="upload-zone">
    <input type="file" id="file-input" accept="image/*" multiple>
    <div class="upload-icon">＋</div>
    <div class="upload-text">Ajoutez vos images</div>
    <div class="upload-hint">Une ou plusieurs — chacune deviendra une vidéo</div>
</div>
<div class="images-grid" id="images-grid"></div>

<div class="section" id="section-prompt">
    <div class="section-header" data-toggle="section-prompt">
        <span class="section-title">✍️ Votre direction (optionnel)</span>
        <span class="chevron">▼</span>
    </div>
    <div class="section-body">
        <div class="section-content">
            <textarea id="main-prompt" placeholder="Décrivez ce que vous voulez en plus... Ex : ajoute un vent léger, ambiance chaleureuse, garde le sujet identique."></textarea>
        </div>
    </div>
</div>

<div class="section" id="section-tech">
    <div class="section-header" data-toggle="section-tech">
        <span class="section-title">📷 Réglages</span>
        <span class="chevron">▼</span>
    </div>
    <div class="section-body">
        <div class="section-content">
<div class="control-row">
    <label class="control-label">Durée</label>
    <select id="duration-select">
        <option value="121">5 secondes</option>
        <option value="153" selected>6,4 secondes (recommandé)</option>
        <option value="241">10 secondes</option>
        <option value="337">14 secondes</option>
        <option value="441">18 secondes (maximum)</option>
    </select>
</div>
            <div class="control-row">
                <label class="control-label">Cadrage</label>
                <select id="framing-select">
                    <option value="random">Aléatoire</option>
                    <option value="close">Très serré</option>
                    <option value="medium">Moyen</option>
                    <option value="wide">Large</option>
                </select>
            </div>
            <div class="control-row">
                <label class="control-label">Intensité</label>
                <select id="intensity-select">
                    <option value="random">Aléatoire</option>
                    <option value="subtle">Subtile</option>
                    <option value="moderate">Modérée</option>
                    <option value="strong">Forte</option>
                </select>
            </div>
        </div>
    </div>
</div>

<button type="button" class="btn-primary" id="generate-btn" disabled>
    Créer les vidéos
</button>

<button type="button" class="btn-stop" id="stop-btn">
    ⏹ Arrêter
</button>

<div id="queue" style="display:none;"></div>

<div class="gallery" id="gallery" style="display:none;">
    <div class="section-title" style="margin-bottom:0.6rem;">Vos vidéos</div>
    <div class="gallery-grid" id="gallery-grid"></div>
</div>

<div class="status-bar" id="status-bar">
    <div class="spinner"></div>
    <span id="status-text">Préparation…</span>
</div>

<div class="toast" id="toast">
    <span id="toast-text">Message</span>
</div>

<canvas id="noSleepCanvas" width="2" height="2"></canvas>
<video id="noSleepVideo" playsinline muted loop></video>

<script src="modes.js"></script>

<script>
const API_BASE = 'https://apihub.agnes-ai.com/v1';
const POLL_BASE = 'https://apihub.agnes-ai.com/agnesapi';
const MODEL_VIDEO = 'agnes-video-v2.0';
const FRAME_RATE = 24;

let createIntervalMs = 62000;
const CREATE_INTERVAL_MIN = 62000;
const POLL_INTERVAL_SEC = 8;
const MAX_POLL_ATTEMPTS = 100;
const API_KEY_STORAGE = 'agnes_api_key';
const MAX_IMAGE_SIZE = 12 * 1024 * 1024;
const THUMBNAIL_MAX_WIDTH = 200;

const state = {
    images: [], isRunning: false, stopRequested: false,
    queue: [], completed: 0, failed: 0,
    currentMode: null, framing: 'random', intensity: 'random',
    durationFrames: 153, isLoadingImages: false
};

let toastTimeout = null;
function showToast(message, type = 'success', duration = 2200) {
    const toast = document.getElementById('toast');
    const text = document.getElementById('toast-text');
    if (!toast || !text) return;
    toast.classList.remove('visible', 'success', 'error', 'warn');
    void toast.offsetWidth;
    text.textContent = message;
    toast.classList.add(type);
    requestAnimationFrame(() => toast.classList.add('visible'));
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('visible'), duration);
}

function renderModes(filter = '') {
    const list = document.getElementById('mode-list');
    const f = filter.toLowerCase().trim();
    const filtered = MODES.filter(m =>
        !f || m.name.toLowerCase().includes(f)
             || m.cat.toLowerCase().includes(f)
             || m.desc.toLowerCase().includes(f)
    );
    const groups = {};
    filtered.forEach(m => {
        if (!groups[m.cat]) groups[m.cat] = [];
        groups[m.cat].push(m);
    });
    let html = '';
    Object.keys(groups).forEach(cat => {
        html += '<div class="mode-category">' + cat + '</div>';
        groups[cat].forEach(m => {
            const selected = state.currentMode && state.currentMode.id === m.id ? 'selected' : '';
            html += '<div class="mode-item ' + selected + '" data-mode="' + m.id + '">' +
                '<div class="mi-emoji">' + m.emoji + '</div>' +
                '<div class="mi-info">' +
                    '<div class="mi-name">' + m.name + '</div>' +
                    '<div class="mi-desc">' + m.desc + '</div>' +
                '</div>' +
                '<div class="mi-num">#' + m.num + '</div>' +
            '</div>';
        });
    });
    list.innerHTML = html;
    list.querySelectorAll('[data-mode]').forEach(el => {
        el.addEventListener('click', () => {
            const mode = MODES.find(m => m.id === el.dataset.mode);
            if (mode) {
                state.currentMode = mode;
                updateModeCurrent();
                renderModes(document.getElementById('mode-search').value);
                showToast('Mode : ' + mode.name, 'success', 1500);
            }
        });
    });
}

function updateModeCurrent() {
    const m = state.currentMode;
    if (!m) return;
    document.getElementById('mc-emoji').textContent = m.emoji;
    document.getElementById('mc-name').textContent = m.name;
    document.getElementById('mc-desc').textContent = m.desc;
    document.getElementById('mc-num').textContent = '#' + m.num;
}

function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function buildPrompt() {
    const mode = state.currentMode;
    if (!mode) return '';
    const parts = [];
    parts.push(mode.basePrompt);
    parts.push('The subject must remain IDENTICAL to the source image: same face, same expression, same clothing, same identity, same composition. This is a CONTINUATION, not a re-imagination.');
    const userPrompt = document.getElementById('main-prompt')?.value.trim();
    if (userPrompt) parts.push('Additional direction (highest priority, must not change subject identity): ' + userPrompt);
    const framingMap = {
        close: 'extreme close-up framing, tight on the subject',
        medium: 'medium shot, subject framed from waist up',
        wide: 'wide shot with the environment visible'
    };
    if (state.framing !== 'random' && framingMap[state.framing]) parts.push(framingMap[state.framing]);
    const intensityMap = {
        subtle: 'very subtle movement, barely perceptible, gentle',
        moderate: 'moderate movement, clear but controlled',
        strong: 'strong dynamic movement, energetic'
    };
    if (state.intensity !== 'random' && intensityMap[state.intensity]) parts.push(intensityMap[state.intensity]);
    else parts.push('moderate movement, controlled');
    parts.push(randomItem(mode.actions));
    parts.push(randomItem(mode.cameras));
    parts.push(randomItem(mode.lights));
    parts.push('Portrait 9:16 vertical, 24fps, no text, no subtitles, no watermarks');
    return parts.join('. ');
}

function getApiKey() {
    try { return (localStorage.getItem(API_KEY_STORAGE) || '').trim(); } catch (e) { return ''; }
}
function saveApiKey() {
    const input = document.getElementById('api-key-input');
    const key = input.value.trim();
    if (!key) {
        try { localStorage.removeItem(API_KEY_STORAGE); } catch (e) {}
        updateApiPanel(); showToast('Clé supprimée', 'warn'); return;
    }
    try {
        localStorage.setItem(API_KEY_STORAGE, key);
        updateApiPanel(); showToast('Clé enregistrée ✓'); input.blur();
    } catch (e) { showToast('Erreur', 'error'); }
}
function updateApiPanel() {
    const panel = document.getElementById('api-panel');
    const input = document.getElementById('api-key-input');
    const line = document.getElementById('api-status-line');
    const text = document.getElementById('api-status-text');
    const key = getApiKey();
    if (key) {
        panel.classList.add('ok'); line.classList.add('ok');
        text.textContent = 'Clé active · ' + key.slice(0, 8) + '…' + key.slice(-4);
        input.value = key;
    } else {
        panel.classList.remove('ok'); line.classList.remove('ok');
        text.textContent = 'Aucune clé API'; input.value = '';
    }
    updateGenerateBtn();
}
function updateGenerateBtn() {
    const btn = document.getElementById('generate-btn');
    if (!btn) return;
    const hasImages = state.images.length > 0;
    const hasKey = !!getApiKey();
    btn.disabled = !hasImages || !hasKey || state.isRunning || state.isLoadingImages || !state.currentMode;
    if (state.isLoadingImages) btn.textContent = 'Chargement…';
    else if (state.isRunning) btn.textContent = 'Création…';
    else if (!hasKey) btn.textContent = 'Ajoutez votre clé API';
    else if (!hasImages) btn.textContent = 'Ajoutez des images';
    else btn.textContent = 'Créer ' + state.images.length + ' vidéo' + (state.images.length > 1 ? 's' : '');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function setStatus(text) {
    const bar = document.getElementById('status-bar');
    const txt = document.getElementById('status-text');
    if (text) { bar.classList.add('visible'); txt.textContent = text; }
    else bar.classList.remove('visible');
}

function fileToDataUri(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = () => reject(new Error('Erreur'));
        reader.readAsDataURL(file);
    });
}
function generateThumbnail(dataUri) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
            try {
                const c = document.createElement('canvas');
                const ratio = img.height / img.width;
                c.width = THUMBNAIL_MAX_WIDTH;
                c.height = Math.round(THUMBNAIL_MAX_WIDTH * ratio);
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                resolve(c.toDataURL('image/jpeg', 0.7));
            } catch (e) { resolve(dataUri); }
        };
        img.onerror = () => resolve(dataUri);
        img.src = dataUri;
    });
}
async function processOneFile(file) {
    if (!file.type.startsWith('image/') || file.size > MAX_IMAGE_SIZE) return null;
    try {
        const dataUri = await fileToDataUri(file);
        const thumbnail = await generateThumbnail(dataUri);
        return { dataUri, thumbnail, id: Date.now() + Math.random() };
    } catch (e) { return null; }
}
async function handleFiles(files) {
    const imgs = Array.from(files).filter(f => f.type.startsWith('image/'));
    if (!imgs.length) return;
    state.isLoadingImages = true;
    updateGenerateBtn();
    setStatus('Chargement des images…');
    const results = await Promise.allSettled(imgs.map(f => processOneFile(f)));
    for (const r of results) {
        if (r.status === 'fulfilled' && r.value) state.images.push(r.value);
    }
    state.isLoadingImages = false;
    setStatus(null);
    updateGenerateBtn();
    renderImages();
}
function removeImage(id) {
    state.images = state.images.filter(i => i.id !== id);
    renderImages();
    updateGenerateBtn();
}
function renderImages() {
    const grid = document.getElementById('images-grid');
    grid.innerHTML = state.images.map(img =>
        '<div class="image-card">' +
            '<img src="' + img.thumbnail + '">' +
            '<button class="remove-btn" data-remove="' + img.id + '">✕</button>' +
        '</div>'
    ).join('');
    grid.querySelectorAll('[data-remove]').forEach(b => {
        b.addEventListener('click', e => {
            e.stopPropagation();
            removeImage(parseFloat(b.dataset.remove));
        });
    });
}

async function apiFetch(url, options = {}) {
    for (let i = 0; i < 7; i++) {
        if (state.stopRequested) throw new Error('Arrêt');
        try {
            const res = await fetch(url, options);
            if (res.status === 429) {
                const wait = [15, 30, 45, 60, 90, 120, 180][Math.min(i, 6)];
                setStatus('L\'IA se prépare… (' + wait + 's)');
                await sleep(wait * 1000); continue;
            }
            if (res.status === 503) {
                const wait = [5, 10, 15, 20, 30, 45][Math.min(i, 5)];
                setStatus('Préparation… (' + wait + 's)');
                await sleep(wait * 1000); continue;
            }
            return res;
        } catch (e) {
            if (e.message === 'Arrêt') throw e;
            const wait = [3, 5, 8, 12, 20, 30][Math.min(i, 5)];
            setStatus('Connexion… (' + wait + 's)');
            await sleep(wait * 1000);
        }
    }
    return fetch(url, options);
}

async function createVideoTask(imageDataUri, prompt) {
    const res = await apiFetch(API_BASE + '/videos', {
        method: 'POST',
        headers: {
            'Authorization': 'Bearer ' + getApiKey(),
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            model: MODEL_VIDEO, prompt: prompt, image: imageDataUri,
            num_frames: state.durationFrames, frame_rate: FRAME_RATE
        })
    });
    if (!res.ok) {
        const err = await res.text();
        throw new Error('HTTP ' + res.status + ' — ' + err.slice(0, 200));
    }
    const data = await res.json();
    const videoId = data.video_id || data.id || data.task_id;
    if (!videoId) throw new Error('Pas de video_id');
    return videoId;
}

async function pollVideo(videoId, onProgress) {
    let remaining = 30;
    while (remaining > 0) {
        if (state.stopRequested) throw new Error('Arrêt');
        onProgress('Préparation… — ' + remaining + 's');
        await sleep(1000); remaining--;
    }
    for (let i = 0; i < MAX_POLL_ATTEMPTS; i++) {
        if (state.stopRequested) throw new Error('Arrêt');
        if (i > 0) {
            let r = POLL_INTERVAL_SEC;
            while (r > 0) {
                if (state.stopRequested) throw new Error('Arrêt');
                onProgress('Création… — ' + r + 's');
                await sleep(1000); r--;
            }
        }
        const url = POLL_BASE + '?video_id=' + encodeURIComponent(videoId) + '&model_name=' + encodeURIComponent(MODEL_VIDEO);
        const res = await apiFetch(url, { headers: { 'Authorization': 'Bearer ' + getApiKey() } });
        const d = await res.json();
        const status = d.status || 'unknown';
        onProgress('Création… — ' + (d.progress || 0) + '%');
        if (status === 'completed' || status === 'succeeded' || status === 'done') {
            const videoUrl = (d.metadata && d.metadata.url) || d.url || (d.output && d.output.url);
            if (!videoUrl) throw new Error('Pas d\'URL');
            return videoUrl;
        }
        if (status === 'failed' || status === 'error') throw new Error('Échec');
    }
    throw new Error('Timeout');
}

function renderQueue() {
    const el = document.getElementById('queue');
    if (!state.queue.length) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    const total = state.queue.length;
    const done = state.completed + state.failed;
    let html = '<div class="queue-summary">' +
        '<span>Progression : ' + done + '/' + total + '</span>' +
        '<span>' + (done < total ? 'En cours' : 'Terminé') + '</span>' +
        '</div>';
    html += state.queue.slice(0, 30).map(item => {
        let icon = '○', cls = 'pending', status = 'En file';
        if (item.status === 'creating') { icon = '◐'; cls = 'creating'; status = 'Préparation'; }
        else if (item.status === 'processing') { icon = '◐'; cls = 'processing'; status = item.progress || 'En cours'; }
        else if (item.status === 'done') { icon = '●'; cls = 'done'; status = 'Terminé'; }
        else if (item.status === 'failed') { icon = '✕'; cls = 'failed'; status = 'Échec'; }
        return '<div class="queue-item ' + cls + '">' +
            '<div>' + icon + '</div>' +
            '<div class="q-name">Image ' + (item.index + 1) + '</div>' +
            '<div class="q-status">' + status + '</div>' +
        '</div>';
    }).join('');
    el.innerHTML = html;
}

function addToGallery(videoUrl, label) {
    const g = document.getElementById('gallery');
    const grid = document.getElementById('gallery-grid');
    g.style.display = 'block';
    const el = document.createElement('div');
    el.className = 'gallery-item';
    el.innerHTML = '<video controls preload="metadata" muted playsinline>' +
        '<source src="' + videoUrl + '" type="video/mp4">' +
        '</video>' +
        '<div class="g-caption"><span>' + label + '</span></div>';
    grid.appendChild(el);
}

async function createTaskOnly(item) {
    item.status = 'creating';
    item.progress = 'Préparation…';
    renderQueue();
    const prompt = buildPrompt();
    const videoId = await createVideoTask(item.image.dataUri, prompt);
    item.videoId = videoId;
    item.startTime = Date.now();
    item.status = 'processing';
    item.progress = 'En cours…';
    renderQueue();
    return videoId;
}

async function pollTaskAndDisplay(item) {
    try {
        const videoUrl = await pollVideo(item.videoId, (p) => {
            item.progress = p; renderQueue();
        });
        item.status = 'done';
        item.videoUrl = videoUrl;
        state.completed++;
        renderQueue();
        updateGenerateBtn();
        const label = state.currentMode.emoji + ' ' + state.currentMode.name;
        addToGallery(videoUrl, label);
    } catch (e) {
        item.status = 'failed';
        item.progress = 'Échec';
        state.failed++;
        renderQueue();
        updateGenerateBtn();
    }
}

async function startGeneration() {
    if (state.isRunning || !state.images.length || !state.currentMode) return;
    if (!getApiKey()) { showToast('Ajoutez votre clé API', 'error'); return; }

    state.isRunning = true;
    state.stopRequested = false;
    state.completed = 0;
    state.failed = 0;

    state.queue = state.images.map((img, i) => ({
        index: i, image: img, status: 'pending', progress: null,
        videoId: null, videoUrl: null, startTime: null
    }));

    document.getElementById('stop-btn').classList.add('visible');
    document.getElementById('generate-btn').disabled = true;
    renderQueue();
    updateGenerateBtn();

    const pollingTasks = [];

    for (let i = 0; i < state.queue.length; i++) {
        if (state.stopRequested) break;
        const item = state.queue[i];
        try {
            await createTaskOnly(item);
            pollingTasks.push(pollTaskAndDisplay(item));
        } catch (e) {
            item.status = 'failed';
            item.progress = 'Échec';
            state.failed++;
            renderQueue();
            updateGenerateBtn();
        }
        if (i < state.queue.length - 1 && !state.stopRequested) {
            const waitSec = Math.ceil(createIntervalMs / 1000);
            for (let r = waitSec; r > 0; r--) {
                if (state.stopRequested) break;
                setStatus('Respiration… — ' + r + 's');
                await sleep(1000);
            }
        }
    }

    if (pollingTasks.length > 0) {
        setStatus('Finalisation…');
        await Promise.allSettled(pollingTasks);
    }

    setStatus('✦ ' + state.completed + ' vidéo' + (state.completed > 1 ? 's' : '') + ' créée' + (state.completed > 1 ? 's' : ''));
    await sleep(3000);
    setStatus(null);

    state.isRunning = false;
    state.stopRequested = false;
    document.getElementById('stop-btn').classList.remove('visible');
    updateGenerateBtn();
    showToast(state.completed + ' vidéo' + (state.completed > 1 ? 's' : ''), 'success');
}

function stopGeneration() {
    state.stopRequested = true;
    setStatus('Arrêt…');
}

async function activateWakeLock() {
    try {
        if ('wakeLock' in navigator) {
            await navigator.wakeLock.request('screen');
        }
    } catch (e) {}
    try {
        const c = document.getElementById('noSleepCanvas');
        const v = document.getElementById('noSleepVideo');
        if (c && v && c.captureStream) {
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, c.width, c.height);
            const stream = c.captureStream(1);
            let t = false;
            setInterval(() => {
                t = !t;
                ctx.fillStyle = t ? '#000' : '#010101';
                ctx.fillRect(0, 0, c.width, c.height);
            }, 1000);
            v.srcObject = stream;
            v.muted = true;
            v.playsInline = true;
            v.play().catch(() => {});
        }
    } catch (e) {}
}

(function init() {
    state.currentMode = MODES.find(m => m.id === 'pub') || MODES[0];
    updateModeCurrent();
    renderModes();

    document.getElementById('mode-search').addEventListener('input', (e) => {
        renderModes(e.target.value);
    });

    document.querySelectorAll('[data-toggle]').forEach(h => {
        h.addEventListener('click', () => {
            document.getElementById(h.dataset.toggle).classList.toggle('open');
        });
    });

    document.getElementById('api-save-btn').addEventListener('click', saveApiKey);
    document.getElementById('api-key-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); saveApiKey(); }
    });
    updateApiPanel();

    const uz = document.getElementById('upload-zone');
    const fi = document.getElementById('file-input');
    uz.addEventListener('click', () => fi.click());
    fi.addEventListener('change', e => { handleFiles(e.target.files); fi.value = ''; });

    document.getElementById('duration-select').addEventListener('change', e => {
        state.durationFrames = parseInt(e.target.value, 10);
    });
    document.getElementById('framing-select').addEventListener('change', e => { state.framing = e.target.value; });
    document.getElementById('intensity-select').addEventListener('change', e => { state.intensity = e.target.value; });

    document.getElementById('generate-btn').addEventListener('click', startGeneration);
    document.getElementById('stop-btn').addEventListener('click', stopGeneration);

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    activateWakeLock();

    console.log('[Atelier] Prêt — ' + MODES.length + ' modes chargés');
})();
</script>
